# ══════════════════════════════════════════════════════════════════════
# Özel Belge Türleri
# ══════════════════════════════════════════════════════════════════════
#
# Servisin yerleşik olarak tanımadığı bir kök elementi kod değiştirmeden
# doğrulatmak için kullanılır. Kök elementi yerleşik kurallarla tanınmayan
# belge, namespace + yerel adı bir tanımla eşleşirse o tanımın XSD'si ve
# (varsa) Schematron tipi ile doğrulanır. Yerleşik türler her zaman önceliklidir.
#
# Alanlar:
#   id              Zorunlu. ^[A-Z][A-Z0-9_]{0,63}$; yerleşik tip adlarıyla çakışamaz.
#                   Yanıtta detectedDocumentType, profillerde scope ve
#                   xsd-overrides anahtarı olarak kullanılır.
#   description     Opsiyonel açıklama.
#   root-namespace  Zorunlu. Kök elementin namespace URI'si (namespace'siz kök için "").
#   root-element    Zorunlu. Kök elementin önek (prefix) içermeyen yerel adı.
#   xsd             Zorunlu. Ana XSD'nin asset dizinine göreli yolu. Göreceli
#                   xs:import / xs:include'lar bu dosyanın konumuna göre çözülür.
#                   GİB sync'in yönettiği validator/ yerine custom/ altını kullanın.
#   schematron      Opsiyonel. Yerleşik Schematron tipi (UBLTR_MAIN, EARCHIVE_REPORT, ...).
#                   Verilmezse Schematron adımı atlanır ve validSchematron=true döner.
#
# Dosya ve XSD'ler değiştiğinde (dosya izleyici veya POST /v1/admin/assets/reload)
# tanımlar yeniden yüklenir. Hatalı tanımlar reload sonucunda raporlanır ve atlanır;
# dosya okunamazsa önceki tanımlar korunur.
#
# Aşağıdaki SAMPLE_VOUCHER tanımı mekanizmayı göstermek için yazılmış uydurma bir
# belge türüdür; herhangi bir resmi standarda karşılık gelmez. XSD'leri
# custom/sample/ altındadır, örnek belge custom/sample/ornek/Sample-Voucher.xml
# dosyasıdır. Kendi tanımlarınızı ekleyin, bu örneği silin.
#
# schematron: UBLTR_MAIN için GİB UBL-TR paketi (GİB sync) yüklü olmalıdır. Bu kökte
# UBL-TR Main Schematron'un yalnız //@currencyID gibi genel kuralları tetiklenir.
# Schematron istemiyorsanız satırı silin; adım atlanır ve validSchematron=true döner.

document-types:
  - id: SAMPLE_VOUCHER
    description: "Örnek belge"
    root-namespace: "urn:example:sample:voucher-1"
    root-element: Voucher
    xsd: custom/sample/maindoc/Sample-Voucher-1.0.xsd
    schematron: UBLTR_MAIN
